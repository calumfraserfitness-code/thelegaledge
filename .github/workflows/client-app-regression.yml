name: Client app regression
on:
  push:
    branches: ['release/daily-nutrition-20261009', 'fix/**']
    paths: ['client-app-v3/**', '.github/workflows/client-app-regression.yml']
  pull_request:
    paths: ['client-app-v3/**', '.github/workflows/client-app-regression.yml']
permissions:
  contents: read
jobs:
  regression:
    name: App regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client-app-v3/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: client-app-v3
      - run: npm test
        working-directory: client-app-v3
