name: Prepare Apple steps shortcut
on:
  push:
    branches: [release/daily-nutrition-20261009]
    paths: ['client-app-v3/shortcuts/**', '.github/workflows/apple-steps-shortcut.yml']
  pull_request:
    paths: ['client-app-v3/shortcuts/**', '.github/workflows/apple-steps-shortcut.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate prepared plist
        run: plutil -lint client-app-v3/shortcuts/Legal-Edge-Steps.unsigned.shortcut
      - name: Sign generic template with Apple
        run: shortcuts sign --mode anyone --input client-app-v3/shortcuts/Legal-Edge-Steps.unsigned.shortcut --output /tmp/Legal-Edge-Steps.shortcut
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Legal-Edge-Steps-signed
          path: /tmp/Legal-Edge-Steps.shortcut
          retention-days: 14
