<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Legal Edge</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#166534}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.hidden{display:none!important}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-family:Georgia,serif;font-size:24px;font-weight:700}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px #00000008}.auth{max-width:430px;margin:8vh auto}.auth h1{font-family:Georgia,serif;font-size:34px;margin:0 0 8px}.field{display:grid;gap:6px;margin:14px 0}.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;background:var(--accent);color:white;font-weight:650}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:7px 10px;font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tab{white-space:nowrap;background:white;border:1px solid var(--line);padding:9px 13px;border-radius:999px;cursor:pointer}.tab.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;font-size:25px;margin-top:4px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section-title h2{font-size:19px;margin:0}.training-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.type-card h3{margin:0 0 4px;font-size:16px}.type-card .count{font-size:30px;font-weight:750;margin:12px 0}.session{border-top:1px solid var(--line);padding:12px 0}.session:first-of-type{border-top:0}.session-title{display:flex;gap:8px;justify-content:space-between;align-items:start}.pill{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.exercise{display:flex;align-items:center;gap:10px;padding:8px 0;color:#374151}.exercise input{width:18px;height:18px}.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.macro{padding:13px;background:#f9fafb;border-radius:12px}.macro strong{display:block;font-size:20px}.checkin{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #d1d5db;border-radius:14px}.notice{padding:10px 12px;border-radius:10px;background:#f3f4f6;margin:12px 0;font-size:14px}.success{color:var(--ok)}@media(max-width:850px){.grid,.training-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:14px}.grid,.training-grid,.macro-grid,.checkin{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:21px}}
</style></head><body>
<div id="auth" class="auth card"><div class="brand">THE LEGAL EDGE</div><h1>Your coaching, clearly.</h1><p class="muted">Training, nutrition, steps, cardio and weekly progress in one place.</p><div class="field"><label>Name</label><input id="name" placeholder="Full name"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@email.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Minimum 6 characters"></div><div style="display:flex;gap:8px"><button class="btn" onclick="signIn()">Log in</button><button class="btn secondary" onclick="signUp()">Create account</button></div><div id="authMsg" class="notice hidden"></div></div>
<div id="app" class="shell hidden"><div class="top"><div><div class="brand">THE LEGAL EDGE</div><div id="hello" class="muted"></div></div><button class="btn secondary small" onclick="signOut()">Log out</button></div><div class="tabs"><button class="tab active" data-view="today">Overview</button><button class="tab" data-view="training">Training</button><button class="tab" data-view="nutrition">Nutrition</button><button class="tab" data-view="checkin">Check-in</button><button class="tab" data-view="progress">Progress</button></div><main id="view"></main></div>
<script>
const URL='https://baxvhilvrhshlfizakak.supabase.co';const KEY='sb_publishable_DRoPSo_3TPlU8mMeLQNruw_82hanHNi';const db=supabase.createClient(URL,KEY);let state={user:null,profile:null,client:null,weeks:[],sessions:[],exercises:[],nutrition:[],meals:[],checkins:[],progress:[]};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function signUp(){const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();if(!name||!email||password.length<6)return msg('Add your name, email and a password of at least 6 characters.');const {error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)return msg(error.message);msg('Account created. Check your email if confirmation is enabled, then log in.',true)}
async function signIn(){const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message);await boot()}
async function signOut(){await db.auth.signOut();location.reload()}function msg(t,ok=false){const x=$('authMsg');x.textContent=t;x.className='notice '+(ok?'success':'')}
async function boot(){const {data:{user}}=await db.auth.getUser();if(!user)return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');state.user=user;await load();$('hello').textContent='Hi '+(state.profile?.full_name||'there');render('today')}
async function load(){let r=await db.from('profiles').select('*').eq('id',state.user.id).single();state.profile=r.data;r=await db.from('clients').select('*').eq('profile_id',state.user.id).single();state.client=r.data;if(!state.client)return;const cid=state.client.id;let q=await db.from('program_weeks').select('*').eq('client_id',cid).order('week_start',{ascending:false}).limit(8);state.weeks=q.data||[];const ids=state.weeks.map(w=>w.id);if(ids.length){q=await db.from('training_sessions').select('*').in('week_id',ids).order('session_date');state.sessions=q.data||[];const sids=state.sessions.map(s=>s.id);if(sids.length){q=await db.from('exercises').select('*').in('session_id',sids).order('sort_order');state.exercises=q.data||[]}q=await db.from('nutrition_days').select('*').in('week_id',ids).order('nutrition_date');state.nutrition=q.data||[];const nids=state.nutrition.map(n=>n.id);if(nids.length){q=await db.from('meals').select('*').in('nutrition_day_id',nids).order('sort_order');state.meals=q.data||[]}}q=await db.from('checkins').select('*').eq('client_id',cid).order('submitted_at',{ascending:false}).limit(12);state.checkins=q.data||[];q=await db.from('progress_entries').select('*').eq('client_id',cid).order('entry_date',{ascending:false}).limit(30);state.progress=q.data||[]}
function currentWeek(){const now=new Date();return state.weeks.find(w=>{const s=new Date(w.week_start+'T00:00:00'),e=new Date(s);e.setDate(e.getDate()+7);return now>=s&&now<e})||state.weeks[0]}
function sessionsFor(type){const w=currentWeek();return w?state.sessions.filter(s=>s.week_id===w.id&&s.training_type===type):[]}
function pct(){const a=state.sessions.filter(s=>currentWeek()&&s.week_id===currentWeek().id);return a.length?Math.round(a.filter(s=>s.status==='completed').length/a.length*100):0}
function render(v){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));const views={today:overview,training,nutrition,checkin,progress};$('view').innerHTML=views[v]();wire()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>render(t.dataset.view));
function overview(){const c=state.client||{},w=currentWeek();return `<div class="grid"><div class="card stat"><span class="muted">Training</span><strong>${pct()}%</strong></div><div class="card stat"><span class="muted">Daily steps</span><strong>${c.daily_steps_goal?.toLocaleString()||'—'}</strong></div><div class="card stat"><span class="muted">Calories</span><strong>${c.calorie_goal||'—'}</strong></div><div class="card stat"><span class="muted">Protein</span><strong>${c.protein_goal_g?c.protein_goal_g+'g':'—'}</strong></div></div><div class="section-title"><h2>This week</h2><span class="muted">${w?esc(w.title||w.week_start):'No week published yet'}</span></div>${trainingCards()}<div class="section-title"><h2>Coach focus</h2></div><div class="card">${w?.coach_note?esc(w.coach_note):'<span class="muted">Your coach notes will appear here.</span>'}</div>`}
function trainingCards(){const labels={weights:'Weights',resistance:'Resistance',cardio:'Cardio',steps:'Steps'};return `<div class="training-grid">${Object.keys(labels).map(type=>{const a=sessionsFor(type),done=a.filter(x=>x.status==='completed').length;return `<div class="card type-card"><span class="pill">${labels[type]}</span><div class="count">${done}/${a.length}</div><span class="muted">completed this week</span></div>`}).join('')}</div>`}
function training(){const labels={weights:'Weights',resistance:'Resistance',cardio:'Cardio',steps:'Steps'};return `<div class="section-title"><h2>Training</h2><span class="muted">Split clearly by training type</span></div>${Object.entries(labels).map(([type,label])=>`<div class="section-title"><h2>${label}</h2></div><div class="card">${sessionsFor(type).length?sessionsFor(type).map(sessionHTML).join(''):'<div class="empty">Nothing scheduled here this week.</div>'}</div>`).join('')}`}
function sessionHTML(s){const ex=state.exercises.filter(e=>e.session_id===s.id);return `<div class="session"><div class="session-title"><div><strong>${esc(s.title)}</strong><div class="muted">${new Date(s.session_date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}${s.target_value?' · '+s.target_value+' '+esc(s.target_unit):''}</div></div><label><input class="sessionCheck" data-id="${s.id}" type="checkbox" ${s.status==='completed'?'checked':''}> Done</label></div>${s.notes?`<p class="muted">${esc(s.notes)}</p>`:''}${ex.map(e=>`<label class="exercise"><input class="exerciseCheck" data-id="${e.id}" type="checkbox" ${e.completed?'checked':''}><span><strong>${esc(e.name)}</strong>${e.sets||e.reps?` · ${e.sets||''}${e.sets?' sets ':''}${esc(e.reps||'')}`:''}${e.load?` · ${esc(e.load)}`:''}</span></label>`).join('')}</div>`}
function nutrition(){const c=state.client||{},w=currentWeek(),days=w?state.nutrition.filter(n=>n.week_id===w.id):[];return `<div class="section-title"><h2>Nutrition</h2><span class="muted">Targets stay visible and simple</span></div><div class="macro-grid"><div class="macro"><span class="muted">Calories</span><strong>${c.calorie_goal||'—'}</strong></div><div class="macro"><span class="muted">Protein</span><strong>${c.protein_goal_g?c.protein_goal_g+'g':'—'}</strong></div><div class="macro"><span class="muted">Carbs</span><strong>${c.carbs_goal_g?c.carbs_goal_g+'g':'—'}</strong></div><div class="macro"><span class="muted">Fat</span><strong>${c.fat_goal_g?c.fat_goal_g+'g':'—'}</strong></div></div><div class="section-title"><h2>This week</h2></div>${days.length?days.map(d=>{const meals=state.meals.filter(m=>m.nutrition_day_id===d.id);return `<div class="card" style="margin-bottom:10px"><div class="session-title"><strong>${new Date(d.nutrition_date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long'})}</strong><label><input class="nutritionCheck" data-id="${d.id}" type="checkbox" ${d.adhered?'checked':''}> On plan</label></div>${meals.map(m=>`<label class="exercise"><input class="mealCheck" data-id="${m.id}" type="checkbox" ${m.completed?'checked':''}><span><strong>${esc(m.meal_name)}</strong>${m.description?' · '+esc(m.description):''}</span></label>`).join('')}</div>`}).join(''):'<div class="empty">Your meal structure will appear here once your coach publishes it.</div>'}`}
function checkin(){return `<div class="section-title"><h2>Weekly check-in</h2><span class="muted">Takes about 2 minutes</span></div><div class="card"><div class="checkin"><div class="field"><label>Weight (kg)</label><input id="ciWeight" type="number" step="0.1"></div><div class="field"><label>Energy 1–10</label><input id="ciEnergy" type="number" min="1" max="10"></div><div class="field"><label>Sleep 1–10</label><input id="ciSleep" type="number" min="1" max="10"></div><div class="field"><label>Stress 1–10</label><input id="ciStress" type="number" min="1" max="10"></div><div class="field"><label>Training adherence %</label><input id="ciTrain" type="number" min="0" max="100"></div><div class="field"><label>Nutrition adherence %</label><input id="ciNut" type="number" min="0" max="100"></div></div><div class="field"><label>Biggest win this week</label><textarea id="ciWins"></textarea></div><div class="field"><label>What got in the way?</label><textarea id="ciChallenges"></textarea></div><div class="field"><label>Anything I need to know?</label><textarea id="ciNotes"></textarea></div><button class="btn" onclick="submitCheckin()">Submit check-in</button><span id="ciMsg" class="muted" style="margin-left:10px"></span></div>`}
function progress(){const rows=state.progress;return `<div class="section-title"><h2>Progress</h2><span class="muted">Keep the trend, not just today's number</span></div><div class="card"><div class="checkin"><div class="field"><label>Weight (kg)</label><input id="pWeight" type="number" step="0.1"></div><div class="field"><label>Steps today</label><input id="pSteps" type="number"></div></div><button class="btn" onclick="saveProgress()">Save today</button></div><div class="section-title"><h2>Recent entries</h2></div><div class="card">${rows.length?rows.map(r=>`<div class="session"><strong>${new Date(r.entry_date+'T00:00:00').toLocaleDateString()}</strong><span class="muted"> · ${r.weight_kg?r.weight_kg+' kg':''}${r.steps?' · '+r.steps.toLocaleString()+' steps':''}</span></div>`).join(''):'<div class="empty">No progress entries yet.</div>'}</div>`}
function wire(){document.querySelectorAll('.sessionCheck').forEach(x=>x.onchange=async()=>{await db.from('training_sessions').update({status:x.checked?'completed':'planned',completed_at:x.checked?new Date().toISOString():null}).eq('id',x.dataset.id);await load();render('training')});document.querySelectorAll('.exerciseCheck').forEach(x=>x.onchange=async()=>{await db.from('exercises').update({completed:x.checked}).eq('id',x.dataset.id)});document.querySelectorAll('.mealCheck').forEach(x=>x.onchange=async()=>{await db.from('meals').update({completed:x.checked}).eq('id',x.dataset.id)});document.querySelectorAll('.nutritionCheck').forEach(x=>x.onchange=async()=>{await db.from('nutrition_days').update({adhered:x.checked}).eq('id',x.dataset.id)})}
async function submitCheckin(){const val=id=>$(id).value?Number($(id).value):null;const {error}=await db.from('checkins').insert({client_id:state.client.id,weight_kg:val('ciWeight'),energy:val('ciEnergy'),sleep:val('ciSleep'),stress:val('ciStress'),training_adherence:val('ciTrain'),nutrition_adherence:val('ciNut'),wins:$('ciWins').value,challenges:$('ciChallenges').value,client_notes:$('ciNotes').value});$('ciMsg').textContent=error?error.message:'Saved ✓';if(!error)await load()}
async function saveProgress(){const today=new Date().toISOString().slice(0,10),weight=$('pWeight').value?Number($('pWeight').value):null,steps=$('pSteps').value?Number($('pSteps').value):null;const {error}=await db.from('progress_entries').upsert({client_id:state.client.id,entry_date:today,weight_kg:weight,steps},{onConflict:'client_id,entry_date'});if(error)return alert(error.message);await load();render('progress')}
boot();
</script></body></html>
